{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="flex justify-center m-8">
    <div class="bg-white w-full max-w-lg p-8 rounded-xl shadow-lg">

        <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">
            Create Account
        </h2>

        <form method="POST" enctype="multipart/form-data" class="space-y-5">

            {% csrf_token %}

            <!-- First & Last Name -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700">First Name</label>
                    <input type="text" name="first_name" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block mb-1 text-sm font-medium text-gray-700">Last Name</label>
                    <input type="text" name="last_name" required
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- Username -->
            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Email -->
            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Profile Picture -->
            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Profile Picture</label>
                <input type="file" name="profile_picture" accept="image/*" class="w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4
                           file:rounded-lg file:border-0 file:text-sm
                           file:font-semibold file:bg-blue-50 file:text-blue-700
                           hover:file:bg-blue-100">
            </div>

            <!-- Role -->
            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Role</label>
                <select name="role" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="">Select Role</option>
                    <option value="job_seeker">Job Seeker</option>
                    <option value="recruiter">Recruiter</option>
                </select>
            </div>

            <!-- Password -->
            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">Confirm Password</label>
                <input type="password" name="confirm_password" required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Register
            </button>

            <!-- Login Link -->
            <p class="text-center text-sm text-gray-600">
                Already have an account?
                <a href="{% url 'login' %}" class="text-blue-600 font-medium hover:underline">Login</a>
            </p>

        </form>
    </div>
</div>


{% endblock %}
