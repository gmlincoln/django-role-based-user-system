{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="flex justify-center m-8">
    <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">

        <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">
            Login to Your Account
        </h2>

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- Email or Username -->
            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">
                    Email or Username
                </label>
                <input type="text" name="email_or_username" required placeholder="Enter email or username"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Password -->
            <div>
                <label class="block mb-1 text-sm font-medium text-gray-700">
                    Password
                </label>
                <input type="password" name="password" required placeholder="Enter password"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Remember & Forgot -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center space-x-2 text-gray-600">
                    <input type="checkbox" class="accent-blue-600">
                    <span>Remember me</span>
                </label>
                <a href="#" class="text-blue-600 hover:underline">
                    Forgot password?
                </a>
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Login
            </button>

            <!-- Register Link -->
            <p class="text-center text-sm text-gray-600">
                Don’t have an account?
                <a href="{% url 'register' %}" class="text-blue-600 font-medium hover:underline">Register</a>
            </p>

        </form>
    </div>
</div>
{% endblock %}
