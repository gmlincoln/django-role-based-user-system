{% extends 'base.html' %}


{% block title %}
Create Job
{% endblock %}



{% block content %}
<div class="m-8">
    <form method="POST" class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-md space-y-6">
        {% csrf_token %}

        <h2 class="text-2xl font-bold border-b pb-3">Post a Job</h2>

        <!-- Job Title -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Job Title</label>
            <input type="text" name="title" maxlength="50"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Enter job title" required>
        </div>

        <!-- Description -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea name="description" rows="4"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Job responsibilities and requirements" required></textarea>
        </div>

        <!-- Grid Row -->
        <div class="grid md:grid-cols-2 gap-6">

            <!-- Openings -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Openings</label>
                <input type="number" name="openings"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Number of vacancies" required>
            </div>

            <!-- Job Type -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Job Type</label>
                <select name="job_type"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    required>
                    <option value="">Select Type</option>
                    <option value="part_time">Part Time</option>
                    <option value="full_time">Full Time</option>
                </select>
            </div>

        </div>

        <!-- Grid Row -->
        <div class="grid md:grid-cols-2 gap-6">

            <!-- Location -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                <input type="text" name="location" maxlength="50"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Job location" required>
            </div>

            <!-- Deadline -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Application Deadline</label>
                <input type="date" name="deadline"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    required>
            </div>

        </div>

        <!-- Salary Image Upload -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Salary</label>
            <input type="number" name="salary"
                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                placeholder="Salary" required>
        </div>

        <!-- Buttons -->
        <div class="flex gap-4 pt-4">
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                Publish Job
            </button>
            <button type="reset" class="px-6 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition">
                Reset
            </button>
        </div>

    </form>
</div>
{% endblock %}
